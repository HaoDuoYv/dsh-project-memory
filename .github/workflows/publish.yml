name: Publish to GitHub Packages

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只跑测试，不发布"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@haoduoyv"

      # 本包零运行时依赖（peer 依赖由宿主提供），不需要 install 步骤，
      # 也就避开了 npm ci 需要 package-lock.json 的坑。
      - name: Syntax check
        run: |
          node --check src/index.js
          node --check src/guard.js

      - name: Unit tests
        run: node test/guard.test.mjs

      - name: Hook scripts syntax
        run: |
          python3 -m py_compile hooks/memory_guard.py
          python3 -m py_compile skills/project-memory/scripts/append_memory.py

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
